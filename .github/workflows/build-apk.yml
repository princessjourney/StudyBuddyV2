name: Build Study Buddy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Study Buddy
        run: |
          unzip -q StudyBuddyV2_CloudBuild.zip -d buildsrc

      - name: Build APK
        run: |
          cd buildsrc/StudyBuddyV2_CloudBuild
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyBuddy-V2-APK
          path: buildsrc/StudyBuddyV2_CloudBuild/app/build/outputs/apk/debug/app-debug.apk
