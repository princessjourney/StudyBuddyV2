name: Build Study Buddy APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Buat APK Study Buddy
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ekstrak proyek
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q StudyBuddyV2_CloudBuild.zip -d buildsrc

      - name: Aktifkan AndroidX
        run: |
          echo "android.useAndroidX=true" > buildsrc/StudyBuddyV2_CloudBuild/gradle.properties
          echo "android.enableJetifier=true" >> buildsrc/StudyBuddyV2_CloudBuild/gradle.properties

      - name: Build APK
        run: |
          cd buildsrc/StudyBuddyV2_CloudBuild
          gradle assembleDebug --stacktrace

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyBuddy-V2-APK
          path: buildsrc/StudyBuddyV2_CloudBuild/app/build/outputs/apk/debug/app-debug.apk
